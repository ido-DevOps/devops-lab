# Container image CI: build → scan → publish to GitHub Container Registry (GHCR).
# The general checks (secrets, tests, security, Conflict Guard) live in pipeline.yml (ido-pipeline).
#
#   pull request      → build + Trivy scan (nothing is pushed)
#   push to main      → build + scan, then push  sha-<commit>, main
#   push tag v1.2.3   → build + scan, then push  1.2.3, 1.2, latest, sha-<commit>
#
# Third-party actions are pinned to a full commit SHA (a tag can be moved by whoever controls the repo;
# a SHA can't). Dependabot keeps the SHAs up to date.
name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: 0.76.1

jobs:
  build-and-scan:
    name: Build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, loaded into the local Docker for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: shortener:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — fail on fixable HIGH/CRITICAL vulnerabilities
        # Run the pinned Trivy image directly instead of a wrapper action: one less third-party dependency.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            shortener:scan

      - name: Smoke test — container starts and /health answers
        run: |
          docker run -d --name smoke -p 8000:8000 shortener:scan
          for _ in $(seq 1 20); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs smoke; exit 1

  publish:
    name: Push to GHCR (amd64 + arm64)
    needs: build-and-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # lets the built-in GITHUB_TOKEN push to ghcr.io — no personal token needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0  (emulation for arm64)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}   # lower-cased by the action (registries require it)
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
